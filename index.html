<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="#" class="logo">Unity Разработчик</a>
        <nav class="navbar">
            <a href="#about">О себе</a>
            <a href="#projects">Проекты</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <section id="about" class="about-section">
        <div class="about-content">
            <h1>Привет, я <span class="highlight">Имя Фамилия</span></h1>
            <p>Я занимаюсь веб-разработкой и создаю адаптивные интерфейсы. Добро пожаловать на мой сайт-портфолио!</p>
            <a href="#contacts" class="btn">Связаться со мной</a>
        </div>
    </section>

    <section id="projects" class="projects-section">
        <h2>Мои Проекты</h2>
        <div class="projects-grid" id="projectsGrid"></div>
    </section>

    <div class="modal-overlay" id="projectModal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="modal-video-wrapper" id="modalVideoWrapper"></div>
            <div class="modal-screenshots" id="modalScreenshots"></div>
            <p id="modalDescription"></p>
        </div>
    </div>

    <div class="modal-overlay image-preview-modal" id="imageModal">
        <div class="image-preview-content">
            <button class="modal-close">&times;</button>
            <img id="previewImage" src="" alt="Крупный просмотр">
        </div>
    </div>

    <section id="contacts" class="contacts-section">
        <h2>Контакты</h2>
        <div class="contact-links">
            <a href="lakey38015@gmail.com" class="contact-item">Email: your-email@example.com</a>
            <a href="https://github.com/MrBelarus" target="_blank" class="contact-item">GitHub</a>
            <a href="https://t.me/reddycat" target="_blank" class="contact-item">Telegram</a>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026. reddycat</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
